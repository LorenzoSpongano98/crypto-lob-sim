name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: clang-format
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-18 --dry-run --Werror

  build:
    name: ${{ matrix.compiler.name }} ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: gcc-14, cc: gcc-14, cxx: g++-14 }
          - { name: clang-18, cc: clang-18, cxx: clang++-18 }
        preset: [debug, release]
        include:
          - compiler: { name: clang-18, cc: clang-18, cxx: clang++-18 }
            preset: asan
          - compiler: { name: clang-18, cc: clang-18, cxx: clang++-18 }
            preset: tsan
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-dev libssl-dev g++-14 libclang-rt-18-dev

      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/${{ matrix.preset }}/_deps
          key: deps-${{ matrix.compiler.name }}-${{ matrix.preset }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Relax ASLR for sanitizers
        if: matrix.preset == 'asan' || matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DTF_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  tidy:
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libboost-dev libssl-dev clang-tidy-18
      - name: Cache fetched dependencies
        uses: actions/cache@v6
        with:
          path: build/tidy/_deps
          key: deps-tidy-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Configure
        run: cmake --preset tidy -DTF_WARNINGS_AS_ERRORS=ON -DTF_CLANG_TIDY_EXE=/usr/bin/clang-tidy-18
      - name: clang-tidy
        run: cmake --build --preset tidy
